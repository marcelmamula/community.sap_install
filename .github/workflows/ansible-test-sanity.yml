---
# Always check ansible-core support matrix before configuring units matrix.
# https://docs.ansible.com/ansible/latest/reference_appendices/release_and_maintenance.html#ansible-core-support-matrix

name: Ansible Test - Sanity

on:
  schedule:
    # Monday at 02:17 UTC (~3:17 AM CET / 4:17 AM CEST). Actual start time depends on GitHub load.
    - cron: '17 2 * * 1'

  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      # Do not trigger workflow for files that do not affect functionality or tests.
      # This helps reduce unnecessary CI runs and saves resources.
      - '**.md'             # All markdown files anywhere in the repository.
      - '**.rst'            # All changelog files anywhere in the repository.
      - 'docs/**'           # All files inside the docs folder on root level.
      - 'roles/**/docs/**'  # All files inside the docs folder inside the roles.
      - 'changelogs/**'     # All files inside the changelogs folder on root level.
      - 'galaxy.yml'        # Collection metadata file.

  workflow_dispatch:

jobs:
  sanity-supported:
    runs-on: ubuntu-latest
    name: Sanity (Supported Ⓐ${{ matrix.ansible }})
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ansible:
          - 'stable-2.18'
          - 'stable-2.19'
          - 'stable-2.20'
          - 'stable-2.21'
          - 'devel'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python for ansible-core install
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --user PyYAML

      - name: Install ansible-core from branch/tag
        run: |
          python -m pip install --user \
            "https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz"

      - name: Prepare collection checkout path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import tempfile
          import yaml

          source = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          with (source / "galaxy.yml").open() as stream:
              metadata = yaml.safe_load(stream)

          # Outside the source checkout: copying cannot recurse into itself.
          root = pathlib.Path(tempfile.mkdtemp(
              prefix="ansible-sanity-",
              dir=os.environ["RUNNER_TEMP"],
          ))
          destination = (
              root / "ansible_collections"
              / metadata["namespace"] / metadata["name"]
          )
          shutil.copytree(source, destination, symlinks=True)

          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"CHECKOUT_PATH={destination}\n")
              stream.write(f"SANITY_LOG_DIR={root / 'logs'}\n")
          PY

      - name: Run ansible-test sanity (selective bootstrap retries)
        shell: bash
        env:
          ANSIBLE_REF: ${{ matrix.ansible }}
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
          TERM: xterm-256color
        run: |
          set -euo pipefail
          cd "$CHECKOUT_PATH"
          mkdir -p "$SANITY_LOG_DIR"

          bootstrap_regex='Command "docker run .*--name ansible-test-init-.*ansible-test-utility-container:.*nsenter .*mount -o remount,rw /sys/fs/cgroup/ && pkill sleep.*" returned exit status [0-9]+\.'

          attempts=1
          if [[ "$ANSIBLE_REF" == "devel" ]]; then
            attempts=3
          fi

          for ((attempt=1; attempt<=attempts; attempt++)); do
            echo "Sanity attempt ${attempt}/${attempts}: ${ANSIBLE_REF}"
            log="${SANITY_LOG_DIR}/attempt-${attempt}.log"

            # keep console output (with possible ANSI colors), and store a raw log
            if ~/.local/bin/ansible-test sanity --docker default -v --junit 2>&1 | tee "$log"; then
              echo "Sanity passed."
              exit 0
            else
              statuses=("${PIPESTATUS[@]}")
              rc="${statuses[0]}"
              if (( statuses[1] != 0 )); then
                echo "::error::Could not capture the test log."
                exit "${statuses[1]}"
              fi
            fi

            if [[ "$ANSIBLE_REF" != "devel" ]] || ! grep -Eq "$bootstrap_regex" "$log"; then
              echo "::error::Not a retryable devel bootstrap failure."
              exit "$rc"
            fi

            if (( attempt == attempts )); then
              echo "::error::Bootstrap failed after ${attempts} attempts."
              exit "$rc"
            fi

            echo "::warning::Known bootstrap failure; retrying in 12 seconds."
            sleep 12
          done
