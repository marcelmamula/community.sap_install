---
# Always check ansible-core support matrix before configuring units matrix.
# https://docs.ansible.com/ansible/latest/reference_appendices/release_and_maintenance.html#ansible-core-support-matrix

name: Ansible Test - Sanity

on:
  schedule:
    # Monday at 02:17 UTC (~3:17 AM CET / 4:17 AM CEST). Actual start time depends on GitHub load.
    - cron: '17 2 * * 1'

  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      # Do not trigger workflow for files that do not affect functionality or tests.
      # This helps reduce unnecessary CI runs and saves resources.
      - '**.md'             # All markdown files anywhere in the repository.
      - '**.rst'            # All changelog files anywhere in the repository.
      - 'docs/**'           # All files inside the docs folder on root level.
      - 'roles/**/docs/**'  # All files inside the docs folder inside the roles.
      - 'changelogs/**'     # All files inside the changelogs folder on root level.
      - 'galaxy.yml'        # Collection metadata file.

  workflow_dispatch:

jobs:
  sanity-supported:
    runs-on: ubuntu-latest
    name: Sanity (Supported Ⓐ${{ matrix.ansible }})
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ansible:
          - 'stable-2.18'
          - 'stable-2.19'
          - 'stable-2.20'
          - 'stable-2.21'
          - 'devel'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python for ansible-core install
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --user PyYAML

      - name: Install ansible-core from branch/tag
        run: |
          python -m pip install --user \
            "https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz"

      - name: Prepare collection checkout path
        run: |
          set -euo pipefail
          ns=$(python - <<'PY'
          import yaml
          with open('galaxy.yml') as f:
              print(yaml.safe_load(f)['namespace'])
          PY
          )
          name=$(python - <<'PY'
          import yaml
          with open('galaxy.yml') as f:
              print(yaml.safe_load(f)['name'])
          PY
          )
          checkout_path="ansible_collections/${ns}/${name}"
          mkdir -p "ansible_collections/${ns}"
          cp -a . "${checkout_path}"
          echo "CHECKOUT_PATH=${checkout_path}" >> "$GITHUB_ENV"

      - name: Run ansible-test sanity (devel bootstrap-retry only)
        shell: bash
        run: |
          set -uo pipefail

          bootstrap_regex='Command "docker run .*--name ansible-test-init-.*ansible-test-utility-container:.*nsenter .*mount -o remount,rw /sys/fs/cgroup/ && pkill sleep.*" returned exit status [0-9]+\.'

          run_sanity_once() {
            set +e
            ~/.local/bin/ansible-test sanity -v --color 2>&1 | tee ansible-test.log
            rc=${PIPESTATUS[0]}
            set -e
            return "$rc"
          }

          attempts=1
          if [[ "${{ matrix.ansible }}" == "devel" ]]; then
            attempts=3
          fi

          for attempt in $(seq 1 "$attempts"); do
            echo "ansible-test sanity attempt ${attempt}/${attempts} for ${{ matrix.ansible }}"

            rm -rf "${CHECKOUT_PATH}/tests/output" || true

            if (cd "${CHECKOUT_PATH}" && run_sanity_once); then
              echo "sanity passed"
              exit 0
            fi

            rc=$?

            if [[ "${{ matrix.ansible }}" != "devel" ]]; then
              echo "non-devel failure; no retry"
              exit "$rc"
            fi

            if ! grep -Eq "$bootstrap_regex" "${CHECKOUT_PATH}/ansible-test.log"; then
              echo "devel failed, but not known bootstrap signature; no retry"
              exit "$rc"
            fi

            if [[ "$attempt" -eq "$attempts" ]]; then
              echo "devel failed with known bootstrap signature after ${attempts} attempts"
              exit "$rc"
            fi

            echo "known devel bootstrap failure signature detected; retrying in 12s"
            sleep 12
          done
